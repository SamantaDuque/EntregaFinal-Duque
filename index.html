<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teje y Desteje</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>
    <header>
        <img src="./assets/Img/logoTejeyDestejeRedondo.png" alt="Logo de Teje y Desteje" class="header-logo" />
        <div class="header-text">
            <h1>Teje y Desteje</h1>
            <p>¡Bienvenidos a nuestra tienda!</p>
        </div>
    </header>



    <main>
        <!-- Sección de productos -->
        <section aria-label="Productos">
            <h2 class="titulo-seccion">Nuestros productos</h2>
            <h3 class="subtitulo-seccion">Hecho a mano con Amor 💕</h3>
            <div id="productos-container" role="list"></div>
            <div id="mensaje-error" class="mensaje-error" aria-live="assertive"></div>
        </section>

        <!-- Sección del carrito -->
        <section id="carrito-section" aria-label="Carrito de compras">
            <h2>🛒 Carrito</h2>
            <div id="carrito-container" role="list"></div>

            <!-- Subtotal -->
            <p id="subtotal" aria-live="polite"></p>

            <!-- Checkbox dentro del carrito -->
            <div class="checkbox-wrapper">
                <label class="checkbox-container" for="primera-compra">
                    <input type="checkbox" id="primera-compra" />
                    ¿Es tu primera compra?
                </label>
            </div>

            <!-- Botones del carrito -->
            <div class="botones-carrito">
                <button id="vaciar-carrito" type="button">Vaciar carrito</button>
                <button id="finalizar-compra" type="button">Finalizar compra</button>
            </div>
        </section>

        <!-- Mensaje final -->
        <section id="mensaje-final" aria-live="polite" role="alert"></section>
    </main>

    <footer>
        <p>© 2025 Teje y Desteje. Todos los derechos reservados.</p>
    </footer>

    <script src="./js/app.js"></script>
</body>

</html>
